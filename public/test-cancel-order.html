<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست دکمه لغو سفارش</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">تست دکمه لغو سفارش</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">دکمه لغو سفارش</h2>
            <button type="button" onclick="showCancelOrderModal('buyer')" 
                    class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                <i class="fas fa-times-circle ml-2"></i>
                لغو سفارش
            </button>
        </div>
        
        <div id="log" class="bg-gray-800 text-green-400 p-4 rounded-lg font-mono text-sm">
            <div>لاگ رویدادها:</div>
        </div>
    </div>

    <!-- Cancel Order Modal -->
    <div id="cancelOrderModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-times-circle text-red-600 text-3xl"></i>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2">لغو سفارش</h3>
                <p class="text-gray-600">آیا مطمئن هستید که می‌خواهید این سفارش را لغو کنید؟</p>
            </div>
            
            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
                <div class="flex items-start gap-3">
                    <i class="fas fa-exclamation-triangle text-yellow-600 mt-1"></i>
                    <div class="text-sm text-gray-700">
                        <p class="font-bold mb-2">توجه:</p>
                        <p class="mb-2">با لغو سفارش، جریمه زیر از کیف پول شما کسر خواهد شد:</p>
                        <p class="text-lg font-bold text-red-600" id="penaltyAmount">محاسبه...</p>
                    </div>
                </div>
            </div>
            
            <form id="cancelOrderForm" action="#" method="POST" onsubmit="return handleSubmit(event)">
                <div class="flex gap-3">
                    <button type="button" onclick="closeCancelOrderModal()" 
                            class="flex-1 px-4 py-3 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors font-bold">
                        انصراف
                    </button>
                    <button type="submit" 
                            class="flex-1 px-4 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-bold">
                        تایید لغو
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div>[${time}] ${message}</div>`;
        }

        function showCancelOrderModal(userType) {
            log('showCancelOrderModal() فراخوانی شد با userType: ' + userType);
            
            // Calculate penalty
            const orderTotal = 10000;
            const penaltyType = 'percentage';
            const penaltyValue = 10;
            
            let penalty = 0;
            if (penaltyType === 'percentage') {
                penalty = (orderTotal * penaltyValue) / 100;
            } else {
                penalty = penaltyValue;
            }
            
            log('جریمه محاسبه شد: ' + penalty);
            
            // Format penalty with Persian numbers
            const penaltyFormatted = new Intl.NumberFormat('fa-IR').format(penalty) + ' تومان';
            document.getElementById('penaltyAmount').textContent = penaltyFormatted;
            
            const modal = document.getElementById('cancelOrderModal');
            modal.classList.remove('hidden');
            log('مودال نمایش داده شد');
        }

        function closeCancelOrderModal() {
            log('closeCancelOrderModal() فراخوانی شد');
            const modal = document.getElementById('cancelOrderModal');
            modal.classList.add('hidden');
            log('مودال بسته شد');
        }

        function handleSubmit(event) {
            event.preventDefault();
            log('فرم submit شد!');
            alert('فرم submit شد! در سایت واقعی، سفارش لغو می‌شود.');
            closeCancelOrderModal();
            return false;
        }

        // Click outside to close
        document.getElementById('cancelOrderModal')?.addEventListener('click', function(e) {
            if (e.target === this) {
                log('کلیک خارج از مودال - بستن مودال');
                closeCancelOrderModal();
            }
        });

        log('صفحه بارگذاری شد - آماده تست');
    </script>
</body>
</html>
